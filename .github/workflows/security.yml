name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"   # auditoría semanal (lunes 06:00 UTC)

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # gitleaks-action@v2 necesita este permiso para anotar PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      # SEC-006: build ignore flags with Python instead of sed/shell to avoid
      # word-splitting issues and eliminate the (theoretical) shell-injection
      # risk of interpolating file content into an unquoted shell variable.
      - name: Build ignore flags
        id: vuln-flags
        run: |
          FLAGS=$(python - <<'EOF'
          import pathlib
          ids = [
              line.strip()
              for line in pathlib.Path("security/accepted-vulnerabilities.txt").read_text().splitlines()
              if line.strip() and not line.startswith("#")
          ]
          print(" ".join(f"--ignore-vuln {i}" for i in ids))
          EOF
          )
          echo "flags=$FLAGS" >> $GITHUB_OUTPUT
      - name: Audit dependencies
        # Las vulnerabilidades ya triadas y aceptadas conscientemente viven en
        # security/accepted-vulnerabilities.txt, con su justificación y fecha
        # de revisión — ver ese archivo y el ADR-003 antes de tocar esta lista.
        # Cualquier CVE NUEVO que no esté ahí seguirá fallando este job, que es
        # el comportamiento deseado (gate real, no decorativo).
        run: pip-audit -r requirements.txt ${{ steps.vuln-flags.outputs.flags }}
